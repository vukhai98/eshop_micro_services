version: '3.8'

services:
    # Database section
    # Order DB : sql server
    orderdb:
        container_name: orderdb
        environment:
             SA_PASSWORD: "Abc@1234"
             ACCEPT_EULA: "Y"
             restart: always
        volumes:
            - ./sqlserver_data:/var/lib/sqlserver/data
        ports:
            - "1435:1433"

    # ProductDB: mysl
    productdb:
        container_name: productdb
        environment:
            MYSQL_ROOT_PASSWORD: "Abc@123"
            restart: always
        volumes:
             - mysql_data:/var/lib/mysql
        ports:
             - "3309:3306"

    # Basketdb: redis
    basketdb:
        container_name: basketdb
        restart: always
        ports:
          - "6379:6379"